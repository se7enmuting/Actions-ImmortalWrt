name: Build ImmortalWrt PVE (Fixed 25.12.2 / 20261105)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "build = 生成固件；configure = 仅检查依赖及配置，不生成固件"
        type: choice
        options: [build, configure]
        default: build
      publish_release:
        description: "编译成功后保存到 GitHub Releases（始终保留旧版本）"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: immortalwrt-fixed-25-pve-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Shanghai
  BUILD_DIR: /mnt/immortalwrt-25-pve
  FORCE_UNSAFE_CONFIGURE: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      firmware_artifact: immortalwrt-fixed-25.12.2-20261105-pve-${{ github.run_number }}-${{ github.run_attempt }}
      build_attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare hosted runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ca-certificates \
            subversion time patch pkg-config libelf-dev xsltproc \
            bzip2 gzip xz-utils zstd cpio bc genisoimage qemu-utils
          sudo install -d -o "$USER" -g "$(id -gn)" "$BUILD_DIR"
          df -h / /mnt

      - name: Fetch locked release, feeds and Bandix
        run: python3 immortalwrt-25.12-fixed-25.12.2-20261105/scripts/prepare.py "$BUILD_DIR"

      - name: Resolve and check configuration
        id: configuration
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          ./scripts/feeds update -a 2>&1 | tee feeds-update.log
          ./scripts/feeds install -a -p packages 2>&1 | tee feeds-install.log
          python3 "$GITHUB_WORKSPACE/immortalwrt-25.12-fixed-25.12.2-20261105/scripts/configure.py" "$BUILD_DIR" \
            2>&1 | tee -a feeds-install.log
          make defconfig 2>&1 | tee defconfig.log
          if grep -q 'recursive dependency detected' defconfig.log; then exit 1; fi
          python3 "$GITHUB_WORKSPACE/immortalwrt-25.12-fixed-25.12.2-20261105/scripts/verify_config.py" \
            "$GITHUB_WORKSPACE/immortalwrt-25.12-fixed-25.12.2-20261105/config.seed" .config
          ./scripts/diffconfig.sh > config.buildinfo

      - name: Download sources
        id: download
        if: inputs.operation == 'build'
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          make download -j8 2>&1 | tee download.log

      - name: Build firmware
        id: compile
        if: inputs.operation == 'build'
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          # Keep memory available for Rust, Go and the BTF linker.
          make -j2 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee build-retry.log

      - name: Collect verified images and build record
        id: collect
        if: inputs.operation == 'build'
        run: |
          python3 immortalwrt-25.12-fixed-25.12.2-20261105/scripts/collect.py "$BUILD_DIR" "$GITHUB_WORKSPACE/firmware"

      - name: Upload firmware
        id: upload
        if: success() && inputs.operation == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immortalwrt-fixed-25.12.2-20261105-pve-${{ github.run_number }}-${{ github.run_attempt }}
          path: firmware/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Summarize build stages
        if: always()
        env:
          CONFIG_RESULT: ${{ steps.configuration.outcome }}
          DOWNLOAD_RESULT: ${{ steps.download.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          COLLECT_RESULT: ${{ steps.collect.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
          PUBLISH_REQUESTED: ${{ inputs.publish_release }}
          OPERATION: ${{ inputs.operation }}
        run: |
          {
            echo "## 构建阶段结果"
            echo "| 阶段 | 结果 |"
            echo "|---|---|"
            echo "| 配置 | $CONFIG_RESULT |"
            echo "| 下载 | $DOWNLOAD_RESULT |"
            echo "| 编译固件 | $COMPILE_RESULT |"
            echo "| 产物验证 | $COLLECT_RESULT |"
            echo "| 上传固件 | $UPLOAD_RESULT |"
            if [[ "$OPERATION" == configure && "$CONFIG_RESULT" == success ]]; then
              echo "仅配置检查完成；本次不编译固件、不发布 Release。"
            elif [[ "$UPLOAD_RESULT" != success ]]; then
              echo "发布未执行：尚无验证通过并上传的固件。请检查上方首次失败阶段及诊断日志。"
            elif [[ "$PUBLISH_REQUESTED" == true ]]; then
              echo "固件已上传，后续由 release job 发布；请以该 job 的结果为准。"
            else
              echo "本次未请求发布 Release。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save configuration and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immortalwrt-fixed-25.12.2-20261105-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            /mnt/immortalwrt-25-pve/*.log
            /mnt/immortalwrt-25-pve/.config
            /mnt/immortalwrt-25-pve/config.buildinfo
            /mnt/immortalwrt-25-pve/build-lock.json
            /mnt/immortalwrt-25-pve/logs/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

  release:
    needs: build
    if: needs.build.result == 'success' && inputs.operation == 'build' && inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.firmware_artifact }}
          path: firmware
      - name: Verify downloaded firmware checksums
        working-directory: firmware
        run: |
          test -s BUILD-INFO.md
          sha256sum --check SHA256SUMS
      - name: Publish this manual build
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ needs.build.outputs.build_attempt }}
        run: |
          set -euo pipefail
          tag="immortalwrt-fixed-25.12.2-20261105-pve-$BUILD_NUMBER-$BUILD_ATTEMPT"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft \
              --target "$SOURCE_COMMIT" \
              --title "ImmortalWrt 25.12.2 Fixed 20261105 PVE · $BUILD_NUMBER-$BUILD_ATTEMPT" \
              --notes-file firmware/BUILD-INFO.md \
              --latest=false
          fi
          gh release upload "$tag" firmware/* --clobber
          gh release edit "$tag" --draft=false --latest=false
          echo "固件发布成功：$(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain publication failure
        if: failure()
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.firmware_artifact }}
        run: |
          echo "Release 发布失败；已验证的固件仍保存在 Artifact：$ARTIFACT_NAME（30 天）。修复发布问题后可仅重跑 release job，复用同次构建产物。" >> "$GITHUB_STEP_SUMMARY"
